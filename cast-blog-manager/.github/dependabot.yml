# 依存パッケージの更新を自動で提案させる。
# Next.js はセキュリティ修正の頻度が高く、放置すると
# 既知の脆弱性を抱えたまま運用することになるため。
version: 2
updates:
  - package-ecosystem: npm
    directory: /cast-blog-manager
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 個別に PR が乱立しないようまとめる
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
<title>OPERATION BLACKOUT</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#07080a;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8e4dc;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%}
  #loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;background:#07080a;
    transition:opacity .8s ease}
  #loading.done{opacity:0;pointer-events:none}
  #loading .title{font-size:24px;letter-spacing:.44em;text-transform:uppercase;opacity:.92}
  #loading .bar{width:min(340px,60vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #loading .bar-fill{height:100%;width:0;background:linear-gradient(90deg,#c9a227,#f2e0a0);
    transition:width .3s ease}
  #loading .stage{font-size:10px;letter-spacing:.28em;opacity:.44;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">
  <div class="title">Operation Blackout</div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="stage">Initialising</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
